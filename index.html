<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. Antonia Santos - Permisos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 0.8rem; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #4338ca; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="login-box">
        <h2>I.E. ANTONIA SANTOS</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">Control de Permisos</p>
        <input type="text" id="user" placeholder="Usuario" value="rector">
        <input type="password" id="pass" placeholder="Contraseña" value="123456">
        <button onclick="ingresar()">Ingresar</button>
    </div>

    <div class="card hidden" id="app-box">
        <h2 style="color: #059669;">¡Bienvenido Rector!</h2>
        <p>Sesión iniciada correctamente en el sistema.</p>
        <button onclick="salir()" style="background: #e11d48;">Cerrar Sesión</button>
    </div>

    <script>
        function ingresar() {
            let u = document.getElementById('user').value.trim();
            let p = document.getElementById('pass').value.trim();

            if (u === "rector" && p === "123456") {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('app-box').classList.remove('hidden');
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        function salir() {
            location.reload();
        }
    </script>
</body>
</html>
