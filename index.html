<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E. Antonia Santos - Permisos</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { color: #1e1b4b; text-align: center; font-size: 26px; margin-bottom: 5px; }
        p.sub { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #334155; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        button { background: #4f46e5; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .box { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 20px; border-radius: 8px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>I.E. ANTONIA SANTOS</h1>
        <p class="sub">Sistema de Gestión de Permisos Laborales - Montería (ALGC)</p>
        
        <form onsubmit="alert('¡Solicitud registrada con éxito!'); return false;">
            <div class="form-group">
                <label>Nombre Completo del Solicitante</label>
                <input type="text" required placeholder="Ej. Ana Milena Gómez">
            </div>
            
            <div class="form-group">
                <label>Cargo</label>
                <select required>
                    <option value="">Seleccione su cargo...</option>
                    <option>Docente Preescolar</option>
                    <option>Docente Básica Primaria</option>
                    <option>Docente Básica Secundaria</option>
                    <option>Personal Administrativo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha del Permiso</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Motivo del Permiso</label>
                <textarea rows="3" required placeholder="Describa brevemente la razón..."></textarea>
            </div>

            <button type="submit">Enviar Solicitud de Permiso</button>
        </form>

        <div class="box">
            <h3 style="margin-top:0; color:#1e1b4b; font-size:16px;">Acceso Directivos (ALGC)</h3>
            <p style="font-size:13px; margin-bottom:5px;">• Rector: <code>rector</code> / <code>RectorAntonia2026*</code></p>
            <p style="font-size:13px; margin-bottom:0;">• Coord. Mañana: <code>coord.manana</code> / <code>MananaAntonia2026*</code></p>
        </div>
    </div>
</body>
</html>
