<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Permisos - I.E. Antonia Santos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .auth-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .auth-card { background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 380px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); text-align: center; }
        .auth-logo { width: 60px; height: 60px; background: #f59e0b; color: #0f172a; border-radius: 12px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
        header { background: #0f172a; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; font-weight: 700; margin-bottom: 0.3rem; font-size: 0.8rem; color: #334155; }
        input { width: 100%; padding: 0.7rem; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; background: #f8fafc; }
        input:focus { outline: none; border-color: #4f46e5; background: #fff; }
        .btn-submit { background: #4f46e5; color: white; border: none; padding: 0.75rem; font-size: 0.9rem; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; }
        .link-btn { background: none; border: none; color: #4f46e5; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-decoration: underline; margin-top: 1rem; display: inline-block; }
    </style>
</head>
<body>

    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <div class="auth-logo"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2 style="font-size: 1.2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">I.E. ANTONIA SANTOS</h2>
            <p style="font-size: 0.75rem; color: #64748b; margin-bottom: 1.5rem;">Control de Permisos</p>

            <!-- Login -->
            <form id="form-login" onsubmit="appLogin(event)">
                <div class="form-group">
                    <label>Usuario / Correo</label>
                    <input type="text" id="l_user" required value="rector">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="l_pass" required value="123456">
                </div>
                <button type="submit" class="btn-submit">Ingresar</button>
                <button type="button" class="link-btn" onclick="toggleView(true)">¿No tienes cuenta? Regístrate</button>
            </form>

            <!-- Registro -->
            <form id="form-register" onsubmit="appRegister(event)" class="hidden">
                <div class="form-group">
                    <label>Nombres y Apellidos</label>
                    <input type="text" id="r_nombre" required placeholder="Tu nombre completo">
                </div>
                <div class="form-group">
                    <label>Correo / Usuario</label>
                    <input type="text" id="r_correo" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="r_pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit" style="background: #059669;">Registrarse</button>
                <button type="button" class="link-btn" onclick="toggleView(false)">← Volver al Login</button>
            </form>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header>
            <h1>Panel Institucional</h1>
            <button onclick="logout()" style="background:#e11d48; color:white; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer; font-weight:bold;">Salir</button>
        </header>
        <main style="padding: 2rem; text-align: center;">
            <h2 id="welcome-title" style="color: #059669; margin-bottom: 1rem;">¡Bienvenido al Sistema!</h2>
            <p>Sesión iniciada correctamente.</p>
        </main>
    </div>

    <script>
        function toggleView(showRegister) {
            if(showRegister) {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
            } else {
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('form-login').classList.remove('hidden');
            }
        }

        function appRegister(e) {
            e.preventDefault();
            let nombre = document.getElementById('r_nombre').value.trim();
            let correo = document.getElementById('r_correo').value.trim().toLowerCase();
            let pass = document.getElementById('r_pass').value.trim();

            let users = JSON.parse(localStorage.getItem('ie_users') || '[]');
            if(users.some(u => u.correo === correo)) {
                alert("Este usuario ya está registrado.");
                return;
            }

            users.push({ nombre, correo, pass });
            localStorage.setItem('ie_users', JSON.stringify(users));
            alert("¡Registro exitoso! Ya puedes iniciar sesión.");
            document.getElementById('form-register').reset();
            toggleView(false);
        }

        function appLogin(e) {
            e.preventDefault();
            let user = document.getElementById('l_user').value.trim().toLowerCase();
            let pass = document.getElementById('l_pass').value.trim();

            if (user === "rector" && pass === "123456") {
                accessGranted("Álvaro González Contreras (Rector)");
                return;
            }

            let users = JSON.parse(localStorage.getItem('ie_users') || '[]');
            let found = users.find(u => u.correo === user && u.pass === pass);
            if (found) {
                accessGranted(found.nombre + " (Docente)");
                return;
            }

            alert("Usuario o contraseña incorrectos.");
        }

        function accessGranted(name) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('welcome-title').textContent = "Bienvenido, " + name;
            sessionStorage.setItem('sesion_activa', name);
        }

        function logout() {
            sessionStorage.removeItem('sesion_activa');
            location.reload();
        }

        window.onload = function() {
            let active = sessionStorage.getItem('sesion_activa');
            if(active) {
                accessGranted(active);
            }
        };
    </script>
</body>
</html>
